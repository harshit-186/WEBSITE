<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
      }
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      button {
        padding: 20px 40px;
        border-radius: 6px;
        cursor: pointer;
        /* position: relative; */
        z-index: 1;
      }
      button:hover {
        color: yellowgreen;
      }
      button::before {
        content: '';
        width: 100%;
        height: 0%;
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: -1;
        transition: height 0.3s linear;
      }
      button:hover::before {
        height: 100%;
        background-color: brown;
      }
    </style>
  </head>
  <body>
    <div>
      <button>Get Started</button>
    </div>
  </body>
</html>
